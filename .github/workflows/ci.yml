name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[probe]" ruff build
      - name: Byte-compile
        run: python -m py_compile prompthound/*.py
      - name: Smoke test (gen + extract)
        run: |
          sudo apt-get update && sudo apt-get install -y poppler-utils
          python -m prompthound gen -f pdf -o /tmp/t.pdf
          pdftotext /tmp/t.pdf - | grep -q 'Vendor Invoice Summary'
      - name: Lint (non-blocking)
        run: ruff check . || true
      - name: Build package
        run: python -m build
